# Versioned releases from Conventional Commits.
#
# REQUIRED REPO SETTING — without it this workflow fails on its first run
# with "GitHub Actions is not permitted to create or approve pull requests":
#   Settings -> Actions -> General -> Workflow permissions
#     -> Read and write permissions
#     -> [x] Allow GitHub Actions to create and approve pull requests
#
# release-please opens a release PR after merges to main; merging that PR
# creates the tag (vX.Y.Z) and the GitHub release. Projects pin a version
# with:  install.sh --ref vX.Y.Z
#
# release-type "simple" manages version.txt and CHANGELOG.md — never edit
# those two by hand.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:      # manual trigger: gh workflow run release

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT (AUTOMERGE_TOKEN), not GITHUB_TOKEN: PRs opened by the
          # default token don't trigger their own CI (GitHub's recursion
          # guard) and can land in the "awaiting maintainer approval" queue —
          # required checks then block the release PR forever.
          token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: simple
