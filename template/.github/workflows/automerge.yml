# Puts PRs the agent opened with the "automated" label into the auto-merge
# queue. Once CI is green, GitHub merges them itself — the agent never has to
# wait around burning API requests.
#
# Two labels opt out:
#   blocked — the agent reported it got stuck, so a human should look
#   plan    — a change to PLAN.md, which is the one thing worth reviewing
#             yourself. A bad plan turns into twenty bad pull requests.

name: automerge

on:
  pull_request:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: |
      contains(github.event.pull_request.labels.*.name, 'automated') &&
      !contains(github.event.pull_request.labels.*.name, 'blocked') &&
      !contains(github.event.pull_request.labels.*.name, 'plan')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        # GITHUB_TOKEN merges do NOT trigger on:push workflows (GitHub's
        # recursion guard) — so release-please never sees bot-merged commits.
        # Set an AUTOMERGE_TOKEN repo secret (a PAT with Contents+PR write,
        # e.g. the gh-agent token) and merges count as yours, triggering
        # release-please immediately. Without it, everything still works;
        # release-please just waits for the next human push (or a manual
        # Actions -> release -> Run workflow).
        # Two paths. Where the auto-merge feature exists (public repos, paid
        # plans) branch protection gates the merge server-side, so --auto is
        # correct. Where it doesn't (private repos on the Free plan), `gh pr
        # merge --auto` would merge IMMEDIATELY — nothing blocks it — skipping
        # CI entirely. There we watch this PR's own checks and only merge
        # after they all pass.
        run: |
          allow="$(gh api "repos/$REPO" --jq '.allow_auto_merge // false' 2>/dev/null || echo false)"
          if [ "$allow" = "true" ]; then
            GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash "$PR" --repo "$REPO"
          else
            echo "no auto-merge on this repo — watching this PR's checks instead"
            sleep 30   # let CI register its check runs first
            for i in 1 2 3; do
              if gh pr checks "$PR" --repo "$REPO" --watch --fail-fast; then
                GH_TOKEN="$MERGE_TOKEN" gh pr merge --squash "$PR" --repo "$REPO"
                exit 0
              fi
              sleep 20   # checks may not have been reported yet — retry
            done
            echo "checks failed or never reported — leaving the PR open for the loop's CI-fix cycle"
            exit 1
          fi
        env:
          # Reads (repo settings, PR checks) use the workflow's own token —
          # fine-grained PATs cannot read check results (no "Checks"
          # permission exists for them). Only the MERGE uses the PAT, so the
          # resulting push still triggers release-please.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
